site_name: Propuestas Didácticas Francisco Javier Hernández Illán 2025-2026
site_url: https://fjavier-hernandez.github.io/pds/
use_directory_urls: false

nav:
  - "Inicio": "index.md"
  - "Propuestas Didácticas":
    - "ASO 2025-2026": "2ASIR - ASO - 25-26.md"
    - "PI 2025-2026": "2ASIR - PI - 25-26.md"
    - "RAL 2025-2026": "1SMR - RAL - 25-26.md"


theme:
  language: es
  name: "material"
  favicon: "imagenes/aso.svg"
  palette:
    - scheme: javi
      #primary: light blue
      #accent: "Teal"
      toggle:
        icon: material/toggle-switch-off-outline
        name: Cambiar a modo noche
    - scheme: slate 
      #primary: light blue
      #accent: "Teal"
      toggle:
        icon: material/toggle-switch
        name: Cambiar a modo día
  font:
    text: Roboto
    code: Roboto Mono
  logo: "./imagenes/aso.svg"
  features:
    - header.autohide
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - content.code.annotate
    - announce.dismiss
    - toc.follow
    - content.code.copy
    - toc.integrate
extra_css:
  - stylesheets/pdf.css

extra:
  status:
      deprecated: Pronto será historia
      new: Recién añadido
      updated: Modificado
  search:
    language: "es"
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:<fj.hernandez@edu.gva.es>
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fjavier-hernandez-illan

  analytics:
    provider: google
    property: G-0CPJP88MBF

plugins:
  - search
  - tags
  # - social:
  #     cards: true
  - print-site:
      enumerate_headings: false
      toc_title: Tabla de contenidos
      include_css: true
      exclude:
        - "index.md"
        - "tags.md"
        - "relacion.md"
        - "satisfaccion.md"
        - "vocabulari.md"
        - "validacion.md"
        - "anexos/*"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - meta
  - pymdownx.details  
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - includes/ra.md
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 4

copyright: 2025-2026 Francisco Javier Hernández Illán - <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es">Licencia CC BY-NC-SA</a>
